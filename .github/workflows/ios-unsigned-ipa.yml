name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -r CycleComp-unsigned.ipa Payload
          rm -rf Payload

      - name: Save IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycleComp-unsigned-IPA
          path: CycleComp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CycleComp-unsigned.ipa
